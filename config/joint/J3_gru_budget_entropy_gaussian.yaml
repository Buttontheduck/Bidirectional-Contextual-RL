# @package _global_
# ENCODER_PLAN.md, joint training: Contextual_PPO with its encoder trained together with the policy (no pilots, no frozen
# encoder), with a GRU instead of the xLSTM (cppo.encoder_arch=gru), at the A rerun's settings (config/rerun/: hidden
# mode, discount 0.99, reward scale 0.1, 2M steps). The rungs J0-J5 add one change each (see ENCODER_PLAN.md).
#
#   python run_step0.py --conditions J0 J1 J2 J3 --seeds 0 1 2 3 4 --jobs 20 --threads 1
# J3: J2 + the Gaussian head (beta-NLL, beta 0.5): the actor and critic read the mean and the log variance
# of the battery estimate, so the policy knows when it doesn't know.
experiment_id: J3_gru_budget_ent_gauss
training:
  total_timesteps: 2000000
cppo:
  gamma: 0.99
  reward_scale: 0.1
  encoder_arch: gru
  ent_coef: 0.01
  context_head: gaussian
  context_variance_input: log_variance
  supervised:
    gradient_steps: 32
    episode_batch_size: 32
    capacity: 2100000
    nll_beta: 0.5
wandb:
  study: ""
  run_name: J3_gru_budget_ent_gauss_gamma${cppo.gamma}_rs${cppo.reward_scale}${wandb.study}_s${training.seed}
  group: J3_gru_budget_ent_gauss_gamma${cppo.gamma}_rs${cppo.reward_scale}${wandb.study}
  tags: [cppo, joint, gru, J3]
