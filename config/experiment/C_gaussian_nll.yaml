# @package _global_
# C: test ordinary NLL. Gaussian estimate (mu_t, sigma2_t) trained by the plain NLL (beta 0);
# the actor and critic read [o_t, mu_t, log sigma2_t]. No speed head.
cppo:
  context_head: gaussian
  context_variance_input: log_variance
  supervised:
    nll_beta: 0.0

wandb:
  run_name: C_gaussian_nll_s${training.seed}
  group: C_gaussian_nll
  tags: [cppo, gaussian_context]
