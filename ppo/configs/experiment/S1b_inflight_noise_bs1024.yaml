# @package _global_
# Step 1 of ENCODER_PLAN.md, in-flight noise for plain PPO (runs 1b_sharp, 1b_linear): in every flight the policy sees
# the battery plus noise early on and the exact battery from flight step env.battery_noise_flight_step (sharp or linear,
# see config/step1/cppo_inflight_noise.yaml). Everything else is 1b (S1b_noisy_bs1024).
defaults:
  - /experiment/S1b_noisy_bs1024
  - _self_
env:
  battery_noise_flight: sharp
  battery_noise_flight_step: 350
wandb:
  run_name: S1b_inflight_bs1024_${env.battery_noise_flight}${env.battery_noise_flight_step}_noise${env.battery_noise}_gamma${ppo.gamma}_rs${ppo.reward_scale}${wandb.study}_s${training.seed}
  group: S1b_inflight_bs1024_${env.battery_noise_flight}${env.battery_noise_flight_step}_noise${env.battery_noise}_gamma${ppo.gamma}_rs${ppo.reward_scale}${wandb.study}
  tags: [ppo, step1, inflight_noise]
