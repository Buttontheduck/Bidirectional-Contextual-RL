# @package _global_
# Memory baseline M1a (PAPER_ASSESSMENT.md, Tier 1 item 1): sb3-contrib's RecurrentPPO with an LSTM reading [o_t, a_{t-1}],
# trained end to end by the PPO losses alone, at 0a_blind's settings (hidden mode, minibatches of 256). Its minibatches are
# runs of consecutive steps of the environments, each starting from the LSTM memory saved at collection.
#
#   python run_step0.py --conditions M1a_lstm M1b_lstm --seeds 0 1 2 3 4 5 6 7 --jobs 16 --threads 1
defaults:
  - /experiment/S0a_blind_bs256
  - _self_
ppo:
  policy: MlpLstmPolicy
memory:
  kind: recurrent
wandb:
  run_name: M1a_lstm${memory.lstm_hidden_size}_bs256_gamma${ppo.gamma}_rs${ppo.reward_scale}${wandb.study}_s${training.seed}
  group: M1a_lstm${memory.lstm_hidden_size}_bs256_gamma${ppo.gamma}_rs${ppo.reward_scale}${wandb.study}
  tags: [ppo, memory_baseline, recurrent]
