# @package _global_
# Memoryless control with step 0's settings (ENCODER_PLAN.md), run 0b_blind: run 0b (S0b_observed_bs1024) in hidden mode,
# so plain PPO sees neither the battery nor any history; minibatches of 1,024 shuffled transitions, the learner of
# the earlier sb3_screen1/sb3_confirm1 blind runs (reward scales 0.01 and 1).
#
#   python run_step0.py --conditions 0a_blind 0b_blind 0c_blind --seeds 0 1 2 3 4 5 6 7
defaults:
  - /experiment/S0b_observed_bs1024
  - _self_
env:
  observation_mode: hidden
wandb:
  run_name: S0b_blind_bs1024_gamma${ppo.gamma}_rs${ppo.reward_scale}${wandb.study}_s${training.seed}
  group: S0b_blind_bs1024_gamma${ppo.gamma}_rs${ppo.reward_scale}${wandb.study}
  tags: [ppo, step0, blind]
