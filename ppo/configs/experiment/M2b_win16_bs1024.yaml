# @package _global_
# Memory baseline M2b (PAPER_ASSESSMENT.md, Tier 1 item 1): plain PPO reading the last 16 steps of [o_t, a_{t-1}, valid] as
# one flat input (no memory beyond the window), at 0b_blind's settings (hidden mode, minibatches of 1024).
#
#   python run_step0.py --conditions M2a_win16 M2b_win16 M2a_win64 M2b_win64 --seeds 0 1 2 3 4 5 6 7 --jobs 32 --threads 1
defaults:
  - /experiment/S0b_blind_bs1024
  - _self_
memory:
  kind: window
  window: 16
wandb:
  run_name: M2b_win${memory.window}_bs1024_gamma${ppo.gamma}_rs${ppo.reward_scale}${wandb.study}_s${training.seed}
  group: M2b_win${memory.window}_bs1024_gamma${ppo.gamma}_rs${ppo.reward_scale}${wandb.study}
  tags: [ppo, memory_baseline, window]
