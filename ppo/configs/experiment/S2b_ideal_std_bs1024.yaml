# @package _global_
# Step 2 of ENCODER_PLAN.md, run 2b_ideal_std: run 2b_ideal (S2b_ideal_bs1024) with the ideal estimator's std appended too, so
# the policy also knows how sure the estimate is (for example whether the battery is known yet early in a flight).
#
#   python run_step0.py --conditions 2a_ideal 2b_ideal 2a_ideal_std 2b_ideal_std --seeds 0 1 2 3 4 5 6 7
defaults:
  - /experiment/S2b_ideal_bs1024
  - _self_
context:
  include_std: true
wandb:
  run_name: S2b_ideal_std_bs1024_gamma${ppo.gamma}_rs${ppo.reward_scale}${wandb.study}_s${training.seed}
  group: S2b_ideal_std_bs1024_gamma${ppo.gamma}_rs${ppo.reward_scale}${wandb.study}
  tags: [ppo, step2, ideal_context, std]
