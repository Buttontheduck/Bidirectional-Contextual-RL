   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="9.153" y="15.52816" transform="rotate(-0 9.153 15.52816)">Two-stage training (ours)</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="52.119" y="38.329894" transform="rotate(-0 52.119 38.329894)">Pilot flights</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(24.423609 51.620228)">11 flying styles,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(26.768609 61.070228)">19,000 flights;</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(14.38025 70.520228)">true battery recorded</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="161.487" y="38.329894" transform="rotate(-0 161.487 38.329894)">Offline GRU encoder</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(130.514187 51.522884)">reads (o_t, a_t-1);</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(124.542312 60.972884)">trained to predict b_t</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(130.829734 70.520228)">(the true battery)</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="264.996" y="38.329269" transform="rotate(-0 264.996 38.329269)">Freeze</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(231.135687 52.298353)">the GRU's estimate</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(233.310062 61.562415)">of the battery, b̂_t</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="358.74" y="38.329894" transform="rotate(-0 358.74 38.329894)">PPO policy</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(328.148359 52.112415)">acts on (o_t, b̂_t);</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(333.181797 60.972884)">never sees b_t</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #eb6834" x="161.487" y="86.398677" transform="rotate(-0 161.487 86.398677)">ablation: target = the ideal estimate instead of b_t</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="9.153" y="106.385295" transform="rotate(-0 9.153 106.385295)">End-to-end training (fails: the autogenic loop)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(30.807094 128.042608)">Policy flies one</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(35.031062 136.882608)">narrow style</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(118.518469 128.042608)">Battery rarely shows</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(132.3315 136.882608)">in the flights</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(212.9815 128.701358)">Encoder learns a clock</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(214.278812 136.882608)">instead of the battery</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(309.498875 128.042608)">Estimate adds nothing:</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(322.002375 136.882608)">policy ignores it</text>
   </g>
  </g>
 </g>
